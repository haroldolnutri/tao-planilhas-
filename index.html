/* ============================ EVENTOS ============================ */
function validateStudent(student, fd){
  if(!student.name || !Number.isFinite(student.age) || student.age < 10 || student.age > 90 || !RANGE_BY_GOAL[student.goal] || ![2,3,4].includes(student.freq)){
    showToast("Confira nome, idade, objetivo e frequência."); return false;
  }
  if((fd.get("recentTimeStr") && !student.recentTimeS) || (!!student.recentDistM !== !!student.recentTimeS) || (student.recentDistM != null && student.recentDistM <= 0)){
    showToast("Informe distância positiva e tempo válido juntos (mm:ss ou hh:mm:ss)."); return false;
  }
  return true;
}
function studentFromForm(fd, id, createdAt){
  const recentTimeS = parseTimeStr(fd.get("recentTimeStr"));
  return {
    id, name: String(fd.get("name") || "").trim(), age:+fd.get("age"), sex: fd.get("sex"), weight:+fd.get("weight")||null,
    level: fd.get("level"), goal: fd.get("goal"), raceDate: fd.get("raceDate")||null,
    freq: +fd.get("freq"), availableDays: Array.from(new Set((fd.get("days")||"").split(",").map(x=>x.trim()).filter(Boolean))),
    experience: fd.get("experience"), recentVolumeKm: +fd.get("recentVolumeKm")||0,
    recentLongestKm: +fd.get("recentLongestKm")||0, rpeUsual: +fd.get("rpeUsual")||null,
    recentDistM: +fd.get("recentDistM")||null, recentTimeS,
    recentHr: +fd.get("recentHr")||null, injuries: fd.get("injuries")||"",
    sleepRoutine: fd.get("sleepRoutine")||"", strength: fd.get("strength"),
    createdAt: createdAt || new Date().toISOString()
  };
}

function bindViewEvents(){
  const main = document.getElementById("main");

  const formAval = document.getElementById("formAvaliacao");
  if(formAval){
    formAval.onsubmit = (e)=>{
      e.preventDefault();
      const fd = new FormData(formAval);
      const id = (DB.config.role === "treinador" || UI.view === "novo_aluno") ? uid("stu") : (currentStudent()?.id || uid("stu"));
      const student = studentFromForm(fd, id);
      if(!validateStudent(student, fd)) return;
      Object.keys(DB.plans).forEach(pid=>{ if(DB.plans[pid].studentId === id && !DB.plans[pid].isTemplate) delete DB.plans[pid]; });
      DB.students[id] = student;
      const plan = generatePlan(student);
      DB.plans[plan.id] = plan;
      DB.config.activeStudentId = id;
      if(DB.config.role !== "treinador") UI.view = "calendario"; else UI.view = "plano_editar";
      saveDB(); render();
      showToast("Planilha gerada com sucesso.");
    };
    return;
  }

  const formEditar = document.getElementById("formEditarAluno");
  if(formEditar){
    const doSave = ()=>{
      const s = currentStudent();
      if(!s) return null;
      const fd = new FormData(formEditar);
      const student = studentFromForm(fd, s.id, s.createdAt);
      if(!validateStudent(student, fd)) return null;
      DB.students[s.id] = student;
      return student;
    };
    formEditar.onsubmit = (e)=>{
      e.preventDefault();
      if(doSave()){ saveDB(); render(); showToast("Dados do aluno atualizados."); }
    };
    const btnRegerar = document.getElementById("btnSalvarRegerar");
    if(btnRegerar) btnRegerar.onclick = ()=>{
      if(!formEditar.reportValidity()) return;
      if(!confirm("Isso substitui a planilha atual deste aluno (o histórico de registros continua salvo). Continuar?")) return;
      const student = doSave();
      if(!student) return;
      // Remove a(s) planilha(s) anterior(es) do aluno para não deixar
      // planos órfãos — a busca por plano usa o primeiro encontrado.
      Object.keys(DB.plans).forEach(pid=>{ if(DB.plans[pid].studentId === student.id && !DB.plans[pid].isTemplate) delete DB.plans[pid]; });
      const plan = generatePlan(student);
      DB.plans[plan.id] = plan;
      UI.view = "plano_editar"; UI.week = 1;
      saveDB(); render();
      showToast("Dados atualizados e nova planilha gerada.");
    };
    return;
  }

  main.querySelectorAll("[data-toggle]").forEach(h=>{
    h.onclick = ()=>{ h.closest(".session").classList.toggle("open"); };
  });
  main.querySelectorAll("[data-week]").forEach(p=>{
    p.onclick = ()=>{ UI.week = +p.dataset.week; render(); };
  });
  main.querySelectorAll("[data-status]").forEach(b=>{
    b.onclick = ()=>{
      const sesId = b.dataset.ses, status = b.dataset.status;
      const s = currentStudent();
      let log = Object.values(DB.logs).find(l=>l.studentId===s.id && l.sessionId===sesId);
      if(!log){ log = {id:uid("log"), studentId:s.id, sessionId:sesId, date:new Date().toISOString()}; DB.logs[log.id]=log; }
      log.status = status;
      saveDB(); render();
      const el = document.querySelector(`.session[data-ses="${sesId}"]`); if(el) el.classList.add("open");
    };
  });
  main.querySelectorAll("[data-save]").forEach(b=>{
    b.onclick = ()=>{
      const sesId = b.dataset.save, s = currentStudent();
      const values = {};
      const fields = {distanceReal:["d_",0,Infinity], durationReal:["du_",0,Infinity], hr:["hr_",0,300], rpe:["rpe_",0,10], pain:["pain_",0,10], fatigue:["fat_",0,10], sleep:["sleep_",0,5], satisfaction:["sat_",0,5]};
      for(const [field,[prefix,min,max]] of Object.entries(fields)){
        const el = document.getElementById(prefix+sesId);
        const value = el.value.trim() === "" ? null : Number(el.value);
        if(el.validity?.badInput || (value !== null && (!Number.isFinite(value) || value < min || value > max))){ showToast("Confira os valores do registro e os limites indicados."); el.focus(); return; }
        values[field] = value;
      }
      values.paceReal = document.getElementById("p_"+sesId).value.trim() || null;
      if(values.paceReal && parsePaceToSec(values.paceReal) == null){ showToast("Informe um ritmo válido em mm:ss."); return; }
      values.notes = document.getElementById("notes_"+sesId).value;
      let log = Object.values(DB.logs).find(l=>l.studentId===s.id && l.sessionId===sesId);
      if(!log){ log = {id:uid("log"), studentId:s.id, sessionId:sesId, date:new Date().toISOString(), status:"concluido"}; DB.logs[log.id]=log; }
      Object.assign(log, values);
      saveDB(); showToast("Registro salvo."); render();
    };
  });

  // Treinador: edição inline de sessão
  main.querySelectorAll("[data-edit]").forEach(inp=>{
    inp.onchange = ()=>{
      const plan = currentPlan(); if(!plan) return;
      const sesId = inp.dataset.ses, field = inp.dataset.edit;
      // O campo "Dia" deve conter um único dia da semana. Se o treinador digitar
      // mais de um (ex.: "Sáb, Dom"), usamos só o primeiro e avisamos — evita que
      // um treino (como o longão) fique associado a dois dias por engano.
      if(field === "day" && /[,/;]/.test(inp.value)){
        const firstDay = inp.value.split(/[,/;]/)[0].trim();
        inp.value = firstDay;
        showToast("Use apenas um dia por treino — mantido: " + firstDay);
      }
      for(const w of plan.weeks){
        const ses = w.sessions.find(x=>x.id===sesId);
        if(ses){
          if(field === "distance" || field === "duration"){
            const value = inp.value.trim() === "" ? null : Number(inp.value);
            if(inp.validity?.badInput || (value !== null && (!Number.isFinite(value) || value < 0))){ showToast("Informe um valor numérico maior ou igual a zero."); inp.value = ses[field] ?? ""; return; }
            ses[field] = value;
          }else ses[field] = inp.value;
          plan.edited = true;
          w.totalKm = Math.round(w.sessions.reduce((a,s)=>a+(s.distance||0),0)*10)/10;
        }
      }
      saveDB(); showToast("Treino atualizado.");
    };
  });

  main.querySelectorAll("[data-dup-ses]").forEach(b=>{
    b.onclick = ()=>{
      const plan = currentPlan(); const sesId = b.dataset.dupSes;
      for(const w of plan.weeks){
        const idx = w.sessions.findIndex(x=>x.id===sesId);
        if(idx>-1){ const copy = {...w.sessions[idx], id: uid("ses")}; w.sessions.splice(idx+1,0,copy); recalcWeekVolume(w); }
      }
      plan.edited = true; saveDB(); render(); showToast("Treino duplicado.");
    };
  });
  main.querySelectorAll("[data-del-ses]").forEach(b=>{
    b.onclick = ()=>{
      if(!confirm("Excluir este treino?")) return;
      const plan = currentPlan(); const sesId = b.dataset.delSes;
      for(const w of plan.weeks){
        const idx = w.sessions.findIndex(x=>x.id===sesId);
        if(idx>-1){ w.sessions.splice(idx,1); recalcWeekVolume(w); }
      }
      plan.edited = true; saveDB(); render(); showToast("Treino excluído.");
    };
  });
  main.querySelectorAll("[data-move-ses]").forEach(b=>{
    b.onclick = ()=>{
      const plan = currentPlan(); const sesId = b.dataset.moveSes; const dir = +b.dataset.dir;
      for(const w of plan.weeks){
        const idx = w.sessions.findIndex(x=>x.id===sesId);
        if(idx>-1){
          const j = idx+dir; if(j<0||j>=w.sessions.length) return;
          [w.sessions[idx], w.sessions[j]] = [w.sessions[j], w.sessions[idx]];
        }
      }
      plan.edited = true; saveDB(); render();
    };
  });
  main.querySelectorAll("[data-goto-week]").forEach(sel=>{
    sel.onchange = ()=>{
      const plan = currentPlan(); const sesId = sel.dataset.gotoWeek; const targetWeek = +sel.value; if(!targetWeek || !plan.weeks.some(w=>w.weekNumber===targetWeek)) return;
      let moved = null;
      for(const w of plan.weeks){
        const idx = w.sessions.findIndex(x=>x.id===sesId);
        if(idx>-1){ moved = w.sessions.splice(idx,1)[0]; recalcWeekVolume(w); }
      }
      const target = plan.weeks.find(w=>w.weekNumber===targetWeek);
      if(moved && target){ target.sessions.push(moved); recalcWeekVolume(target); }
      plan.edited = true; saveDB(); render(); showToast("Treino reagendado para a semana "+targetWeek+".");
    };
  });
  const btnAddSes = document.getElementById("btnAddSes");
  if(btnAddSes) btnAddSes.onclick = ()=>{
    const plan = currentPlan(); const week = plan.weeks.find(w=>w.weekNumber===(UI.week||1)) || plan.weeks[0];
    const type = document.getElementById("newSesType").value;
    const day = document.getElementById("newSesDay").value || "—";
    week.sessions.push(newSessionFromTemplate(type, day));
    recalcWeekVolume(week); plan.edited = true; saveDB(); render(); showToast("Treino adicionado — ajuste os detalhes.");
  };

  const btnNovoAluno = document.getElementById("btnNovoAluno");
  if(btnNovoAluno) btnNovoAluno.onclick = ()=>{ DB.config.activeStudentId=null; UI.view="novo_aluno"; render(); };

  main.querySelectorAll("tr[data-student]").forEach(row=>{
    row.onclick = ()=>{ DB.config.activeStudentId = row.dataset.student; UI.week = 1; UI.view="plano_editar"; saveDB(); render(); };
  });

  const btnGerarPlano = document.getElementById("btnGerarPlano");
  if(btnGerarPlano) btnGerarPlano.onclick = ()=>{
    const s = currentStudent(); const plan = generatePlan(s); DB.plans[plan.id]=plan; saveDB(); render();
    showToast("Sugestão gerada como rascunho — revise e publique quando estiver pronta.");
  };
  const btnCriarZero = document.getElementById("btnCriarZero");
  if(btnCriarZero) btnCriarZero.onclick = ()=>{
    const s = currentStudent();
    const weeksStr = prompt("Quantas semanas terá o plano?", RANGE_BY_GOAL[s.goal]?.default || 8);
    if(weeksStr === null) return;
    const totalWeeks = Math.max(1, Math.min(24, Math.floor(+weeksStr || 8)));
    const plan = createBlankPlan(s, totalWeeks); DB.plans[plan.id]=plan; saveDB(); render();
    showToast("Plano em branco criado — adicione os treinos semana a semana.");
  };
  const btnPublicar = document.getElementById("btnPublicar");
  if(btnPublicar) btnPublicar.onclick = ()=>{ const p = currentPlan(); p.published = true; saveDB(); render(); showToast("Plano publicado — o aluno já pode vê-lo."); };
  const btnDespublicar = document.getElementById("btnDespublicar");
  if(btnDespublicar) btnDespublicar.onclick = ()=>{ const p = currentPlan(); p.published = false; p.approved = false; saveDB(); render(); showToast("Plano voltou a ser rascunho."); };
  const btnRegerar = document.getElementById("btnRegerar");
  if(btnRegerar) btnRegerar.onclick = ()=>{
    const s = currentStudent();
    if(!confirm("Substituir a planilha atual por uma nova sugestão?")) return;
    const old = currentPlan(); if(old) delete DB.plans[old.id];
    const plan = generatePlan(s); DB.plans[plan.id]=plan; saveDB(); render();
    showToast("Nova sugestão gerada como rascunho — revise antes de publicar.");
  };
  const btnDuplicar = document.getElementById("btnDuplicar");
  if(btnDuplicar) btnDuplicar.onclick = ()=>{
    const plan = currentPlan(); const name = prompt("Nome do modelo:", RANGE_BY_GOAL[plan.goal].label + " — " + plan.level);
    if(!name) return;
    const copy = JSON.parse(JSON.stringify(plan)); copy.id = uid("plan"); copy.studentId = null; copy.isTemplate = true; copy.published = false; copy.templateName = name;
    DB.plans[copy.id] = copy; saveDB(); showToast("Modelo salvo.");
  };
  const btnExportCsv = document.getElementById("btnExportCsv");
  if(btnExportCsv) btnExportCsv.onclick = ()=> exportCsv(currentStudent(), currentPlan());
  const btnImprimir = document.getElementById("btnImprimir");
  if(btnImprimir) btnImprimir.onclick = ()=>{
    const s = currentStudent(); const plan = currentPlan();
    if(!s || !plan){ showToast("Nenhuma planilha para exportar."); return; }
    document.getElementById("printArea").innerHTML = buildPrintHTML(s, plan);
    window.print();
  };

  if(document.getElementById("chartVolume")) drawCharts(currentStudent());
}

function exportCsv(s, plan){
  const rows = [["Semana","Fase","Dia","Treino","Objetivo","Aquecimento","Parte_principal","Desaquecimento","Distancia_km","Duracao_min","Ritmo","Zona_FC","Esforco","Recuperacao","Observacoes"]];
  plan.weeks.forEach(w=>{
    w.sessions.forEach(ses=>{
      rows.push([w.weekNumber, labelFase(w), ses.day, ses.name, ses.objective||"", ses.warmup||"", ses.main||"", ses.cooldown||"", ses.distance||"", ses.duration||"", ses.pace||"", ses.hrZone||"", ses.rpe||"", ses.recovery||"", ses.notes||""]);
    });
    rows.push([w.weekNumber, "TOTAL DA SEMANA", "", "", "", "", "", "", w.totalKm, "", "", "", "", "", ""]);
  });
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  const a = document.createElement("a");
  const url = URL.createObjectURL(blob);
  a.href = url; a.download = `planilha_${s.name.replace(/\s+/g,'_')}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

init();
</script>
