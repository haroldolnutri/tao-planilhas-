<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --ink:#0c0c0e;
  --surface:#18181b;
  --surface-2:#212124;
  --line: #2d2d31;
  --text:#f5f4f2;
  --text-dim:#9b9a9c;
  --amber:#c1341b;
  --amber-ink:#fff3ee;
  --teal:#3fa796;
  --brick:#d97a2b;
  --paper:#f5f2ea;
  --paper-2:#ffffff;
  --paper-line:#dcd6c8;
  --paper-text:#1a1a1a;
  --paper-dim:#6b675c;
  --radius: 3px;
}
[data-theme="light"]{
  --ink: var(--paper);
  --surface: var(--paper-2);
  --surface-2: #ece7db;
  --line: var(--paper-line);
  --text: var(--paper-text);
  --text-dim: var(--paper-dim);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ink);
  color:var(--text);
  font-family:'Inter',sans-serif;
  font-size:15px;
  line-height:1.5;
  transition:background .2s ease, color .2s ease;
}
h1,h2,h3,h4{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  letter-spacing:.2px;
  margin:0 0 6px 0;
}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;}
a{color:var(--amber);}

/* ---------- App shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column;}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 22px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--ink);z-index:20;
}
.brand{display:flex;align-items:baseline;gap:10px;}
.brand .mark{
  font-family:'Oswald',sans-serif;font-weight:700;font-size:22px;letter-spacing:.5px;
  color:var(--amber);
}
.brand .sub{font-size:12px;color:var(--text-dim);}
.topbar-right{display:flex;align-items:center;gap:10px;}

.role-switch{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.role-switch button{
  background:transparent;border:none;color:var(--text-dim);padding:8px 14px;font-size:13px;cursor:pointer;
}
.role-switch button.active{background:var(--amber);color:var(--amber-ink);font-weight:600;}
.icon-btn{
  background:transparent;border:1px solid var(--line);color:var(--text);
  width:34px;height:34px;border-radius:var(--radius);cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center;
}
.icon-btn:hover{border-color:var(--amber);}

.layout{display:flex;flex:1;min-height:0;}
.sidebar{
  width:210px;flex-shrink:0;border-right:1px solid var(--line);
  padding:18px 10px;display:flex;flex-direction:column;gap:2px;
}
.sidebar button{
  text-align:left;background:transparent;border:none;color:var(--text-dim);
  padding:10px 12px;border-radius:var(--radius);cursor:pointer;font-size:14px;
  border-left:2px solid transparent;
}
.sidebar button:hover{color:var(--text);}
.sidebar button.active{color:var(--text);border-left:2px solid var(--amber);background:var(--surface);}
.sidebar .student-pick{
  margin-top:14px;padding-top:14px;border-top:1px solid var(--line);
}
.sidebar select{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--line);padding:8px;border-radius:var(--radius);font-size:13px;}

main{flex:1;min-width:0;padding:22px 28px 60px;overflow-x:hidden;}
.view{display:none;}
.view.active{display:block;}

/* ---------- Generic elements ---------- */
.section-title{
  display:flex;align-items:baseline;gap:10px;margin-bottom:16px;
}
.section-title h2{font-size:22px;}
.section-title .count{color:var(--text-dim);font-size:13px;}

.grid{display:grid;gap:14px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

.tile{
  border:1px solid var(--line);padding:14px 16px;border-radius:var(--radius);background:var(--surface);
}
.tile .label{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.6px;}
.tile .value{font-family:'Oswald',sans-serif;font-size:26px;margin-top:4px;}
.tile .value small{font-size:14px;color:var(--text-dim);font-family:'Inter',sans-serif;}

table{width:100%;border-collapse:collapse;font-size:14px;}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;}
th{color:var(--text-dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;}

input,textarea,select{
  width:100%;background:var(--surface);color:var(--text);border:1px solid var(--line);
  padding:9px 10px;border-radius:var(--radius);font-family:inherit;font-size:14px;
}
input:focus,textarea:focus,select:focus{outline:2px solid var(--amber);outline-offset:1px;}
label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:5px;}
.field{margin-bottom:14px;}
fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:0 0 16px;}
legend{padding:0 8px;font-family:'Oswald',sans-serif;font-size:14px;color:var(--amber);}

.btn{
  background:var(--amber);color:var(--amber-ink);border:none;padding:10px 18px;
  border-radius:var(--radius);font-weight:600;cursor:pointer;font-size:14px;
}
.btn:hover{filter:brightness(1.08);}
.btn.secondary{background:transparent;color:var(--text);border:1px solid var(--line);}
.btn.secondary:hover{border-color:var(--amber);color:var(--amber);}
.btn.danger{background:var(--brick);color:#fff;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}

.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.3px;}
.badge.ok{background:rgba(63,167,150,.18);color:var(--teal);}
.badge.warn{background:rgba(193,52,27,.16);color:var(--amber);}
.badge.bad{background:rgba(217,122,43,.18);color:var(--brick);}
.badge.muted{background:var(--surface-2);color:var(--text-dim);}

.alert{
  border-left:3px solid var(--brick);background:rgba(217,122,43,.08);
  padding:10px 14px;border-radius:0 var(--radius) var(--radius) 0;margin-bottom:10px;font-size:13.5px;
}
.alert.warn{border-color:var(--amber);background:rgba(193,52,27,.08);}
.alert .t{font-weight:600;margin-bottom:2px;}

.card{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:16px 18px;margin-bottom:14px;}
.card h3{font-size:16px;margin-bottom:10px;}
.hint{font-size:12.5px;color:var(--text-dim);margin-top:4px;}
.divider{border:none;border-top:1px solid var(--line);margin:18px 0;}

/* week nav */
.week-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;}
.week-pill{
  flex-shrink:0;border:1px solid var(--line);background:var(--surface);color:var(--text-dim);
  padding:8px 12px;border-radius:20px;font-size:12.5px;cursor:pointer;white-space:nowrap;
}
.week-pill.active{border-color:var(--amber);color:var(--amber);background:rgba(193,52,27,.08);}
.week-pill.deload{border-style:dashed;}
.week-pill .n{font-family:'Oswald',sans-serif;margin-right:4px;}

.session{
  border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;background:var(--surface);
}
.session-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
.session-head .day{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;}
.session-head h4{font-size:16px;}
.session-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text-dim);margin:6px 0 10px;}
.session-body{display:none;font-size:13.5px;}
.session.open .session-body{display:block;}
.session-body p{margin:6px 0;}
.session-body .lbl{color:var(--text-dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;}
.status-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.status-row button{
  border:1px solid var(--line);background:transparent;color:var(--text-dim);padding:6px 12px;
  border-radius:20px;font-size:12px;cursor:pointer;
}
.status-row button.sel-done{background:rgba(63,167,150,.18);border-color:var(--teal);color:var(--teal);}
.status-row button.sel-partial{background:rgba(193,52,27,.16);border-color:var(--amber);color:var(--amber);}
.status-row button.sel-skip{background:rgba(217,122,43,.18);border-color:var(--brick);color:var(--brick);}

.log-form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px;}
@media(max-width:900px){.log-form{grid-template-columns:repeat(2,1fr);}}
.log-form .full{grid-column:1/-1;}

.ref-item{border-bottom:1px solid var(--line);padding:14px 0;}
.ref-item:last-child{border-bottom:none;}
.ref-item .src{font-size:11.5px;color:var(--amber);text-transform:uppercase;letter-spacing:.5px;}
.ref-item h4{font-size:15px;margin:4px 0 6px;}
.ref-item p{margin:0 0 6px;font-size:13.5px;color:var(--text-dim);}
.ref-item .applied{font-size:13px;border-left:2px solid var(--teal);padding-left:10px;margin-top:6px;}

.chart-wrap{position:relative;height:230px;}

.empty{
  text-align:center;padding:60px 20px;color:var(--text-dim);border:1px dashed var(--line);border-radius:var(--radius);
}

.toast{
  position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--amber);
  padding:12px 18px;border-radius:var(--radius);font-size:13.5px;z-index:100;opacity:0;transform:translateY(8px);
  transition:all .25s ease;pointer-events:none;
}
.toast.show{opacity:1;transform:translateY(0);}

.students-table tr{cursor:pointer;}
.students-table tr:hover{background:var(--surface-2);}

.pace-tag{font-family:'IBM Plex Mono',monospace;font-size:13px;}

#printArea{display:none;}

@media print{
  .topbar,.sidebar,.no-print,.layout,.toast{display:none !important;}
  main{padding:0;}
  body{background:#fff;color:#000;}
  #printArea{display:block !important;}
}

.print-header{text-align:center;padding-bottom:14px;border-bottom:3px solid #8b1c0c;margin-bottom:18px;}
.print-logo{max-width:280px;height:auto;margin:0 auto 10px;display:block;}
.print-header h1{font-family:'Oswald',sans-serif;font-size:20px;margin:0 0 8px;color:#111;}
.print-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;font-size:12.5px;color:#333;}
.print-meta div{margin:0 9px;}
.print-meta strong{color:#111;}

.print-overview{margin-bottom:22px;}
.print-overview h2{font-family:'Oswald',sans-serif;font-size:16px;border-bottom:1px solid #ccc;padding-bottom:4px;margin-bottom:10px;color:#111;}
.print-overview-table{width:100%;border-collapse:collapse;font-size:12px;}
.print-overview-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:#777;padding:4px 8px;border-bottom:2px solid #ccc;}
.print-overview-table td{padding:5px 8px;border-bottom:1px solid #eee;color:#222;}
.print-overview-table tr.deload-row td{color:#8a6a2f;}
.print-overview-table tr.taper-row td{color:#8b1c0c;}
.print-phase-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;}

.print-week{margin-bottom:0;padding-top:6px;}
.print-week h2{font-family:'Oswald',sans-serif;font-size:17px;margin:0 0 4px;color:#111;}
.print-week .print-week-sub{font-size:11.5px;color:#8b1c0c;text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin:0 0 10px;}
.print-week-summary{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;}
.print-week-summary .chip{margin-right:8px;}
.print-week-summary .chip{background:#faf8f5;border:1px solid #e2ddd0;border-radius:5px;padding:5px 10px;font-size:12px;color:#333;}
.print-week-summary .chip strong{display:block;font-size:13.5px;color:#111;font-family:'Oswald',sans-serif;}

.print-total{border:2px solid #8b1c0c;border-radius:6px;padding:16px 18px;background:#faf8f5;}
.print-total h2{border-bottom:none;color:#8b1c0c;margin-bottom:12px;}

.print-session{border:1px solid #ddd;border-left-width:5px;border-radius:6px;padding:12px 14px;margin-bottom:12px;page-break-inside:avoid;break-inside:avoid;}
.print-session-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.print-session-head h3{font-family:'Oswald',sans-serif;font-size:14.5px;margin:0;color:#111;}
.print-session-tag{font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;padding:2px 8px;border-radius:10px;color:#fff;white-space:nowrap;}
.print-stats-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.print-stats-row .print-stat{margin-right:6px;}
.print-stat{background:#f6f5f2;border:1px solid #e6e2d8;border-radius:5px;padding:4px 9px;font-size:11.5px;color:#333;white-space:nowrap;}
.print-stat b{color:#111;}
.print-steps{font-size:12px;color:#333;margin:0 0 8px;padding-left:0;list-style:none;}
.print-steps li{padding:3px 0 3px 16px;border-left:2px solid #ddd;margin-left:3px;position:relative;}
.print-steps li:last-child{border-left:2px solid transparent;}
.print-steps li::before{content:"";position:absolute;left:-5px;top:6px;width:8px;height:8px;border-radius:50%;background:#bbb;}
.print-steps li b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:#8b1c0c;margin-bottom:1px;}
.print-extra{font-size:11.5px;color:#555;background:#f9f9f7;border-radius:5px;padding:7px 10px;margin-top:6px;}
.print-extra div{margin-bottom:3px;}
.print-extra div:last-child{margin-bottom:0;}
.print-extra b{color:#333;}
.print-log{font-size:11.5px;background:#f5f2ea;border-left:3px solid #8b1c0c;padding:8px 10px;border-radius:0 4px 4px 0;margin-top:8px;}
.print-log-title{font-weight:700;color:#8b1c0c;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:5px;}
.print-log-grid{display:flex;flex-wrap:wrap;gap:5px 14px;}
.print-log-grid span{white-space:nowrap;margin-right:14px;}
.print-log-grid span:after{content:"";}
.print-log-grid b{color:#111;}
.print-log-note{margin-top:5px;font-style:italic;color:#444;}
.print-log-pending{background:#f2f2f2;border-left-color:#999;color:#666;font-style:italic;}
@media print{.print-session,.print-week,.print-total{break-inside:avoid;}
  .print-week,.print-total{page-break-before:always;}
  .print-week:first-of-type{page-break-before:auto;}}

@media(max-width:760px){
  .layout{flex-direction:column;}
  .sidebar{width:100%;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);}
  .sidebar .student-pick{display:none;}
  main{padding:16px;}
  .grid-4{grid-template-columns:1fr 1fr;}
}

/* ---------- Refinamento visual 2026 ---------- */
:root{--ink:#0c0c0e;--surface:#18181b;--surface-2:#212124;--line:#2d2d31;--text:#f5f4f2;--text-dim:#9b9a9c;--amber:#c1341b;--amber-ink:#fff3ee;--teal:#3fa796;--brick:#d97a2b;--radius:14px;--shadow:0 18px 48px rgba(0,0,0,.28)}
[data-theme="light"]{--ink:#f6f4f0;--surface:#fff;--surface-2:#efece6;--line:#e0dcd3;--text:#18160f;--text-dim:#726d63;--shadow:0 16px 40px rgba(30,20,10,.08)}
body{min-height:100vh;background:radial-gradient(circle at 84% -12%,rgba(193,52,27,.14),transparent 30%),var(--ink);font-size:14px}
button,input,textarea,select{transition:border-color .2s,background .2s,color .2s,transform .2s,box-shadow .2s}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(193,52,27,.3);outline-offset:2px}
.topbar{min-height:92px;padding:10px clamp(16px,3vw,38px);background:color-mix(in srgb,var(--ink) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line);position:relative}
.topbar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--amber) 18%,var(--amber) 82%,transparent)}
.brand{align-items:center;gap:16px}.logo-plate{background:#fff;border-radius:14px;padding:8px 14px;display:flex;align-items:center;box-shadow:0 3px 10px rgba(0,0,0,.25)}.brand .logo{height:56px;width:auto;display:block}
[data-theme="light"] .logo-plate{box-shadow:0 2px 6px rgba(0,0,0,.1);border:1px solid var(--line)}
.brand .brandtext{display:flex;flex-direction:column;gap:1px;padding-left:16px;border-left:1px solid var(--line)}
.brand .sub{font-size:11.5px;letter-spacing:.3px;color:var(--text-dim);max-width:180px;line-height:1.35}.topbar-right{gap:12px}
.role-switch{padding:4px;background:var(--surface);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.08)}.role-switch button{padding:8px 16px;border-radius:8px}.role-switch button.active{box-shadow:0 4px 12px rgba(193,52,27,.28)}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--surface)}
.sidebar{width:238px;padding:24px 14px;gap:7px;background:color-mix(in srgb,var(--surface) 42%,transparent)}
.sidebar button{padding:12px 14px;border:1px solid transparent;border-left:1px solid transparent;border-radius:11px;font-weight:600}.sidebar button:hover{background:var(--surface);transform:translateX(2px)}
.sidebar button.active{border:1px solid color-mix(in srgb,var(--amber) 35%,var(--line));border-left:3px solid var(--amber);background:linear-gradient(90deg,rgba(193,52,27,.14),var(--surface));box-shadow:0 10px 28px rgba(0,0,0,.08)}
.sidebar .student-pick{margin:18px 4px 0;padding-top:18px}.sidebar select{border-radius:10px}
main{width:100%;max-width:1440px;margin:0 auto;padding:32px clamp(18px,3vw,42px) 72px}.section-title{margin-bottom:20px}.section-title h2{font-size:clamp(24px,3vw,32px);letter-spacing:.1px}.section-title .count{padding:4px 9px;border-radius:999px;background:var(--surface-2)}
.grid{gap:16px}.tile,.card,.session{border-color:color-mix(in srgb,var(--line) 86%,transparent);box-shadow:var(--shadow)}
.tile{padding:18px 20px;background:linear-gradient(145deg,var(--surface),color-mix(in srgb,var(--surface-2) 55%,var(--surface)));overflow:hidden;position:relative}.tile::after{content:'';position:absolute;width:72px;height:72px;right:-30px;top:-30px;border-radius:50%;background:rgba(193,52,27,.1)}.tile .value{font-size:30px}
.card{padding:20px 22px;margin-bottom:16px}.card h3{font-size:18px}
input,textarea,select{min-height:43px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--surface) 88%,var(--ink))}input:hover,textarea:hover,select:hover{border-color:color-mix(in srgb,var(--amber) 45%,var(--line))}input:focus,textarea:focus,select:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(193,52,27,.14)}
fieldset{padding:18px;border-radius:14px}legend{font-size:15px;font-weight:600}.btn{min-height:42px;padding:10px 18px;border-radius:10px;box-shadow:0 7px 18px rgba(193,52,27,.18)}.btn:hover{filter:none;transform:translateY(-1px);box-shadow:0 10px 24px rgba(193,52,27,.26)}.btn.secondary{box-shadow:none;background:var(--surface)}.btn.danger{box-shadow:0 7px 18px rgba(217,122,43,.16)}
.badge{padding:4px 9px}.alert{padding:13px 15px;border-radius:8px 12px 12px 8px}.week-strip{gap:8px;padding:2px 1px 10px}.week-pill{padding:9px 13px;background:var(--surface);border-radius:999px}.week-pill:hover{border-color:var(--amber);transform:translateY(-1px)}.week-pill.active{box-shadow:0 7px 18px rgba(193,52,27,.14)}
.session{padding:17px 18px;border-radius:14px}.session:hover{border-color:color-mix(in srgb,var(--amber) 35%,var(--line))}.session-head h4{font-size:17px}.session-meta{gap:8px 16px}.session-body{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}.status-row button{padding:7px 12px;background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
table{border-collapse:separate;border-spacing:0}.students-table{overflow:hidden}th{padding:11px 12px;background:color-mix(in srgb,var(--surface-2) 55%,transparent)}td{padding:12px}.chart-wrap{height:250px}.empty{border-radius:16px;background:color-mix(in srgb,var(--surface) 60%,transparent)}.toast{bottom:24px;right:24px;padding:13px 18px;border-radius:12px;box-shadow:var(--shadow)}
@media(max-width:760px){.topbar{min-height:68px}.brand .sub{display:none}.brand .brandtext{border-left:none;padding-left:0}.logo-plate{padding:5px 9px;border-radius:10px}.brand .logo{height:38px}.role-switch button{padding:7px 11px}.layout{display:block}.sidebar{position:sticky;top:68px;z-index:15;width:100%;padding:9px 12px;gap:6px;background:color-mix(in srgb,var(--ink) 92%,transparent);backdrop-filter:blur(16px)}.sidebar button{flex:0 0 auto;padding:9px 12px;white-space:nowrap}.sidebar button.active{border-left:1px solid color-mix(in srgb,var(--amber) 35%,var(--line));border-bottom:2px solid var(--amber)}main{padding:22px 14px 56px}.grid-2,.grid-3{grid-template-columns:1fr}.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{padding:15px}.tile .value{font-size:25px}.card{padding:17px}.log-form{grid-template-columns:1fr 1fr}table{min-width:620px}.card:has(table){overflow-x:auto}.toast{left:14px;right:14px;bottom:14px;text-align:center}}
@media(max-width:430px){.grid-4{grid-template-columns:1fr}.log-form{grid-template-columns:1fr}.log-form .full{grid-column:auto}.role-switch button{font-size:12px}.icon-btn{width:36px;height:36px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
@media(max-width:760px){
  .sidebar .student-pick{display:block;flex:0 0 180px;margin:0;padding:0;border:0}
  main{overflow-x:auto}
}
</style>

const STORE_KEY = "passada_v1";
let DB = { students: {}, plans: {}, logs: {}, config: { theme: "dark", role: "aluno", activeStudentId: null } };

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function normalizeDB(value){
  const object = v=>v && typeof v === "object" && !Array.isArray(v);
  if(!object(value)) throw new Error("Dados salvos inválidos");
  const config = object(value.config) ? value.config : {};
  return {students:object(value.students)?value.students:{}, plans:object(value.plans)?value.plans:{}, logs:object(value.logs)?value.logs:{},
    config:{theme:config.theme === "light" ? "light" : "dark", role:config.role === "treinador" ? "treinador" : "aluno", activeStudentId:config.activeStudentId || null}};
}
async function loadDB(){
  try{
    if(window.storage?.get){
      const res = await window.storage.get(STORE_KEY);
      if(res?.value) DB = normalizeDB(JSON.parse(res.value));
    }else{
      const saved = localStorage.getItem(STORE_KEY);
      if(saved) DB = normalizeDB(JSON.parse(saved));
    }
  }catch(e){ console.error("Falha ao carregar dados", e); showToast("Os dados salvos não puderam ser carregados. Verifique o armazenamento antes de cadastrar novamente."); }
}
function saveDB(){
  const value = JSON.stringify(DB);
  const failed = e=>{ console.error("Falha ao salvar", e); showToast("Não foi possível salvar agora. Tente novamente."); };
  try{
    if(window.storage?.set) Promise.resolve(window.storage.set(STORE_KEY, value)).catch(failed);
    else localStorage.setItem(STORE_KEY, value);
  }catch(e){ failed(e); }
}

function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,9); }
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove("show"), 2600);
}
function fmtKm(v){ return (Math.round(v*10)/10).toString().replace(".",",") + " km"; }
// Ordem cronológica padrão da semana (usada para ordenar sessões por dia
// e para distribuir treinos nos dias corretos, evitando choques/duplicações).
const WEEKDAY_CANON_ORDER = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
function WEEKDAY_SORT_ORDER(day){
  const i = WEEKDAY_CANON_ORDER.indexOf(day);
  return i === -1 ? 99 : i;
}
function fmtPace(secPerKm){
  if(!Number.isFinite(secPerKm) || secPerKm <= 0) return "—";
  const total = Math.round(secPerKm);
  const m = Math.floor(total/60), s = total%60;
  return m + ":" + String(s).padStart(2,"0") + "/km";
}
function parsePaceToSec(str){
  // aceita "5:30" -> 330
  const m = String(str).trim().match(/^(\d+):(\d{1,2})$/);
  if(!m || +m[2] >= 60) return null;
  const value = (+m[1])*60 + (+m[2]);
  return value > 0 ? value : null;
}

/* ---------------- Zonas de FC (percentual da FC máx estimada) ---------------- */
function hrZones(age){
  const hrmax = 208 - 0.7*age; // Tanaka et al., mais preciso que 220-idade em adultos
  return {
    hrmax: Math.round(hrmax),
    z1: [Math.round(hrmax*0.60), Math.round(hrmax*0.70)],
    z2: [Math.round(hrmax*0.70), Math.round(hrmax*0.80)],
    z3: [Math.round(hrmax*0.80), Math.round(hrmax*0.87)],
    z4: [Math.round(hrmax*0.87), Math.round(hrmax*0.93)],
    z5: [Math.round(hrmax*0.93), Math.round(hrmax*1.00)],
  };
}

/* ---------------- Estimativa de ritmos (fórmula de Riegel, 1977) ----------------
   T2 = T1 * (D2/D1)^1.06 — modelo preditivo clássico e amplamente usado em
   treinamento para estimar tempos equivalentes em outras distâncias a partir
   de um resultado recente. É uma estimativa, não uma promessa de desempenho,
   e deve sempre poder ser revisada manualmente pelo treinador. */
function estimatePaces(recentDistM, recentTimeS){
  if(!Number.isFinite(recentDistM) || !Number.isFinite(recentTimeS) || recentDistM <= 0 || recentTimeS <= 0) return null;
  const riegel = (d2) => recentTimeS * Math.pow(d2/recentDistM, 1.06);
  const t10k = riegel(10000);
  const t5k  = riegel(5000);
  const thresholdPace = t10k/10;     // referência de limiar (~ritmo de 10 km)
  return {
    threshold: thresholdPace,
    easy: thresholdPace + 35,        // rodagem ativa: +30-40s/km
    long: thresholdPace + 25,        // longão firme, ainda abaixo do limiar
    marathonish: thresholdPace + 5,
    tempo: Math.max(1, thresholdPace - 5),
    interval5k: Math.max(1, t5k/5 - 10),
    predicted10k: t10k,
    predicted5k: t5k,
  };
}

/* ============================ GERAÇÃO DA PLANILHA ============================
   Lógica própria, transparente e revisável — não é uma cópia de nenhuma
   planilha comercial. Os parâmetros usados (faixas de semanas, redução em
   platôs, taper, teto de progressão do longão) estão descritos e referenciados
   na aba "Base científica" e reaproveitados aqui como constantes nomeadas. */

const RANGE_BY_GOAL = {
  adaptacao:  {min:4, max:8, default:6, label:"Iniciar / caminhada-corrida"},
  "5k":       {min:8, max:12, default:10, label:"5 km"},
  "10k":      {min:8, max:12, default:10, label:"10 km"},
  "15k":      {min:10, max:16, default:12, label:"15 km"},
  "21k":      {min:12, max:20, default:15, label:"Meia maratona (21,1 km)"},
};
const TAPER_WEEKS_BY_GOAL = { adaptacao:0, "5k":1, "10k":1, "15k":2, "21k":3 };
const BASE_LONG_KM = { adaptacao:2, "5k":4, "10k":6, "15k":8, "21k":10 };
const TARGET_LONG_KM = { adaptacao:6, "5k":9, "10k":14, "15k":18, "21k":22 };
const TARGET_WEEKLY_KM = { adaptacao:16, "5k":28, "10k":40, "15k":52, "21k":64 };

function computeTotalWeeks(goal, level, raceDate){
  const range = RANGE_BY_GOAL[goal];
  let weeks = range.default;
  if(level === "iniciante") weeks = Math.min(range.max, weeks + 2);
  if(raceDate){
    const days = (new Date(raceDate) - new Date());
    const weeksAvail = Math.floor(days/(1000*60*60*24*7));
    if(weeksAvail > 0){
      weeks = Math.max(range.min, Math.min(range.max, weeksAvail));
    }
  }
  return { weeks, range };
}

function sessionSkeletonByFreq(freq, level){
  // define os "papéis" de cada treino da semana, por frequência
  if(freq === 2) return ["qualidade","longao"];
  if(freq === 3) return ["leve","qualidade","longao"];
  return ["leve","qualidade","leve_subida","longao"]; // 4x
}

function buildSession(role, weekNumber, phase, level, paces, longKm, easyKm, isDeload, isTaper, isWalkRun, wrLevel){
  const alt = "Se estiver muito cansado, com pouco tempo ou dor leve: troque por 20-30 min de caminhada regenerativa ou reduza o treino pela metade, mantendo o mesmo ritmo.";
  const rpeTxt = (a,b)=> a+"–"+b+"/10";

  if(isWalkRun){
    // progressão caminhada-corrida (estilo run-walk-run, base Galloway/World Athletics "Get Running")
    const runSec = Math.min(60 + wrLevel*30, 300);
    const walkSec = Math.max(120 - wrLevel*10, 60);
    const reps = 6 + Math.min(wrLevel, 6);
    return {
      day:"", type:"caminhada_corrida",
      name:"Caminhada + corrida intervalada",
      objective:"Construir uma base aeróbica com impacto controlado, alternando corrida leve e caminhada.",
      warmup:"5 min de caminhada em ritmo confortável.",
      main: reps+"x ("+Math.round(runSec/60*10)/10+" min correndo em ritmo bem confortável + "+Math.round(walkSec/60*10)/10+" min caminhando)",
      cooldown:"5 min de caminhada leve + alongamento leve opcional.",
      duration: Math.round((runSec+walkSec)*reps/60 + 10),
      distance: null,
      pace: "Conversacional — dá para falar frases inteiras",
      hrZone: "Zona 1–2",
      rpe: rpeTxt(3,5),
      recovery: "Caminhada entre os tiros de corrida, conforme descrito acima.",
      notes: "Priorize a sensação de facilidade, não a velocidade. O objetivo aqui é consistência.",
      alternative: alt
    };
  }

  // Constantes de aquecimento/desaquecimento usadas para calcular a duração
  // total de cada treino a partir do que o "main" realmente descreve — os
  // minutos batem com o texto prescrito, não são um número solto.
  const LEVE_WU = 6.5, LEVE_CD = 5;           // "5-8 min" (méd. 6,5) + "5 min"
  const LONGAO_WU = 5, LONGAO_CD = 7.5;       // "5 min" + "5-10 min" (méd. 7,5)
  const FARTLEK_WU = 10 + 1, FARTLEK_CD = 8;  // "10 min" + 4x15s (~1 min) + "8 min"
  const FARTLEK_MAIN_MIN = 17.5;              // méd. de "15-20 min"
  const INT_WU = 13.5, INT_CD = 10;           // méd. de "12-15 min" + "10 min"
  const HILL_WU = 10, HILL_CD = 10;

  const sessions = {
    leve: {
      name:"Rodagem leve", objective:"Manter a base aeróbica sem acumular fadiga.",
      warmup:"5-8 min de caminhada + trote bem leve.",
      main: fmtKm(easyKm)+" em ritmo leve e confortável.",
      cooldown:"5 min de caminhada + alongamento leve.",
      duration: Math.round(easyKm* (paces? paces.easy/60 : 7) + LEVE_WU + LEVE_CD),
      distance: easyKm, pace: paces? fmtPace(paces.easy): "Confortável (fala frases inteiras)",
      hrZone:"Zona 1–2", rpe: rpeTxt(3,5), recovery:"—",
      notes:"Se o ritmo indicado parecer difícil hoje, vá mais devagar — o objetivo é a duração/distância, não o ritmo.",
    },
    qualidade: phase === "base" ? {
      name:"Fartlek", objective:"Introduzir variações de ritmo de forma lúdica, sem estrutura rígida.",
      warmup:"10 min de trote leve + 4 acelerações curtas de 15s.",
      main:"15-20 min alternando livremente entre 1-3 min mais forte (mas controlado) e 1-3 min de trote leve, por sensação.",
      cooldown:"8 min de trote bem leve + caminhada.",
      // Sem distância-alvo (é um treino por sensação, não por km) — a duração
      // vem só da soma do que está descrito acima.
      duration: Math.round(FARTLEK_WU + FARTLEK_MAIN_MIN + FARTLEK_CD),
      distance: null, pace: "Variável — por sensação (Esforço 6-7 nos trechos fortes)",
      hrZone:"Zona 2–3 (alternando)", rpe: rpeTxt(5,7), recovery:"Trote leve entre os trechos fortes.",
      notes:"Não é um treino cronometrado — o objetivo é aprender a variar de ritmo com conforto.",
    } : (()=>{
      const especifico = phase === "especifico";
      // "5-6x1000m" ou "8-10x400m" — usamos o meio da faixa para calcular
      // km e tempo reais, em vez de um número fixo desconectado do texto.
      const reps = especifico ? 5.5 : 9;
      const kmPerRep = especifico ? 1.0 : 0.4;
      const mainKm = Math.round(reps*kmPerRep*10)/10;
      const recoveryMinPerGap = especifico ? 2.5 : 75/60; // "2-3 min" | "60-90s"
      const recoveryMin = recoveryMinPerGap * Math.max(0, reps-1);
      const mainMin = mainKm * (paces? paces.interval5k/60 : 4.5);
      return {
        name:"Intervalado", objective:"Desenvolver potência aeróbica e economia de corrida.",
        warmup:"12-15 min de trote leve + 4 progressivos de 20s + mobilidade.",
        main: (especifico? "5-6x1000m" : "8-10x400m") + " no ritmo de referência de 5 km, com recuperação em trote leve.",
        cooldown:"10 min de trote bem leve + alongamento.",
        duration: Math.round(INT_WU + mainMin + recoveryMin + INT_CD),
        distance: mainKm, pace: paces? fmtPace(paces.interval5k) : "Forte, mas sustentável para todos os tiros",
        hrZone:"Zona 4", rpe: rpeTxt(7,8), recovery: especifico? "2-3 min de trote leve entre os tiros" : "60-90s de trote leve entre os tiros",
        notes:"A técnica e a consistência entre os tiros importam mais do que o primeiro tiro ser o mais rápido.",
      };
    })(),
    leve_subida: (()=>{
      // "6-8x subida de 60-90m" — meio da faixa: 7 tiros de 75m.
      const reps = 7, rampKm = 0.075;
      const perRepMin = 65/60; // ~25s de subida forte + ~40s de trote na volta
      const mainMin = reps*perRepMin;
      return {
        name:"Treino de subidas", objective:"Ganhar força específica de corrida e economia, com baixo impacto articular.",
        warmup:"10 min de trote leve até o pé da subida.",
        main:"6-8x subida de 60-90m em esforço forte e controlado, voltando em trote leve.",
        cooldown:"10 min de trote leve em terreno plano.",
        duration: Math.round(HILL_WU + mainMin + HILL_CD),
        distance: Math.round(reps*rampKm*2*10)/10, // subida + descida de cada tiro
        pace: "Esforço forte na subida, sem sprintar", hrZone:"Zona 3–4",
        rpe: rpeTxt(6,8), recovery:"Descida em trote leve entre as subidas.",
        notes:"Passos curtos e rápidos, olhar à frente, sem tensionar os ombros.",
      };
    })(),
    longao: {
      name: isTaper? "Longão reduzido (polimento)" : "Longão",
      objective: isTaper? "Manter o estímulo de longa duração com bem menos volume, chegando descansado à prova." : "Desenvolver resistência aeróbica e economia de corrida em esforço prolongado.",
      warmup:"5 min de caminhada + trote leve.",
      main: fmtKm(longKm)+" em ritmo confortável"+(phase==="especifico" && !isTaper? ", com os últimos 10-15 min no ritmo-alvo de prova":"")+".",
      cooldown:"5-10 min de caminhada + alongamento.",
      duration: Math.round(longKm*(paces? paces.long/60 : 7.5) + LONGAO_WU + LONGAO_CD),
      distance: longKm, pace: paces? fmtPace(paces.long): "Confortável, com fala",
      hrZone:"Zona 2 (com trechos em Zona 3 se indicado)", rpe: rpeTxt(4,6), recovery:"—",
      notes: isDeload? "Semana de regeneração — o longão está propositalmente mais curto esta semana." : "Hidrate-se antes e leve água/isotônico se ultrapassar 75-90 min.",
    }
  };
  const s = sessions[role];
  return {...s, day:"", type:role, alternative: alt};
}

function generatePlan(student){
  const {weeks, range} = computeTotalWeeks(student.goal, student.level, student.raceDate);
  const taperWeeks = Math.min(TAPER_WEEKS_BY_GOAL[student.goal], Math.max(0, weeks-4));
  const isWalkRunGoal = student.goal === "adaptacao" && student.level === "iniciante";
  const paces = estimatePaces(student.recentDistM, student.recentTimeS);
  function normalizeAvailableDays(rawDays, freq){
  // Normaliza abreviações/acentos e remove duplicatas. Os dias informados
  // são sempre reordenados na ordem cronológica real da semana (Dom→Sáb),
  // independente da ordem em que o aluno/treinador os digitou — isso evita
  // que o treino "role" para o dia errado só porque foi escrito fora de ordem.
  // Se faltarem dias para a frequência escolhida, completa com o padrão
  // semanal (sem repetir nenhum dia já usado), garantindo que o mesmo dia
  // da semana nunca apareça duas vezes na mesma semana de treino.
  const CANON = {
    "dom":"Dom","domingo":"Dom",
    "seg":"Seg","segunda":"Seg","segunda-feira":"Seg",
    "ter":"Ter","terca":"Ter","terça":"Ter","terca-feira":"Ter","terça-feira":"Ter",
    "qua":"Qua","quarta":"Qua","quarta-feira":"Qua",
    "qui":"Qui","quinta":"Qui","quinta-feira":"Qui",
    "sex":"Sex","sexta":"Sex","sexta-feira":"Sex",
    "sab":"Sáb","sáb":"Sáb","sabado":"Sáb","sábado":"Sáb"
  };
  const WEEK_ORDER = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  const norm = (d)=>{
    const k = String(d||"").trim().toLowerCase();
    return CANON[k] || (d ? String(d).trim() : "");
  };
  const seen = new Set();
  const cleaned = (rawDays||[]).map(norm).filter(d=>WEEK_ORDER.includes(d)).filter(d=>{
    if(seen.has(d)) return false;
    seen.add(d); return true;
  });
  const DEFAULT_ORDER = ["Ter","Qui","Sáb","Dom","Seg","Qua","Sex"];
  const need = Math.max(2, Math.min(4, Number(freq) || 3));
  if(cleaned.length < need){
    for(const d of DEFAULT_ORDER){
      if(cleaned.length >= need) break;
      if(!seen.has(d)){ cleaned.push(d); seen.add(d); }
    }
  }
  // Reordena cronologicamente (Dom→Sáb); dias fora do padrão (texto livre
  // não reconhecido) ficam ao final, na ordem em que foram informados.
  const known = cleaned.filter(d=>WEEK_ORDER.includes(d))
    .sort((a,b)=>WEEK_ORDER.indexOf(a)-WEEK_ORDER.indexOf(b));
  const unknown = cleaned.filter(d=>!WEEK_ORDER.includes(d));
  return [...known, ...unknown].slice(0, need);
}

const days = normalizeAvailableDays(student.availableDays, student.freq);
  const skeleton = sessionSkeletonByFreq(student.freq, student.level);

  const startLong = Math.max((student.recentLongestKm||0)*0.9, BASE_LONG_KM[student.goal]);
  const endLong = Math.max(startLong, Math.min(TARGET_LONG_KM[student.goal], (student.recentLongestKm||0)*2.2 + BASE_LONG_KM[student.goal]));
  const startEasy = Math.max((student.recentVolumeKm||0)/Math.max(student.freq,2)*0.85, isWalkRunGoal? 0: 2.5);
  const easySessionCount = skeleton.filter(role=>role === "leve").length;
  // Estimativas usadas só para orçar o volume/progressão da semana (não são
  // a distância exibida em cada treino — essa vem de buildSession, calculada
  // a partir do que o próprio treino prescreve).
  const qualitySessionKm = student.freq === 2 ? 5.5 : 6.5;
  const hillSessionKm = skeleton.includes("leve_subida") ? 5.5 : 0;
  const initialEstimatedKm = startLong + startEasy*easySessionCount + qualitySessionKm + hillSessionKm;
  const baseWeeklyKm = Math.max(student.recentVolumeKm||0, initialEstimatedKm);
  const weeklyCeilingKm = Math.max(TARGET_WEEKLY_KM[student.goal], baseWeeklyKm);

  const weekList = [];
  let buildLongKm = startLong, buildWeeklyKm = baseWeeklyKm, wrLevel = 0;
  const buildWeekPhase = (w)=>{
    const distFromEnd = weeks - w;
    if(distFromEnd < taperWeeks) return "taper";
    if(w <= Math.ceil(weeks*0.35)) return "base";
    if(w <= Math.ceil(weeks*0.75)) return "especifico";
    return "pre-competitivo";
  };

  for(let w=1; w<=weeks; w++){
    const phase = buildWeekPhase(w);
    const isTaper = phase === "taper";
    const isDeload = !isTaper && (w % 4 === 0);
    let longKm = buildLongKm;
    let weeklyKm = buildWeeklyKm;
    let easyKm = startEasy;

    if(isTaper){
      // Bosquet et al. 2007: redução exponencial de 41-60% do volume, mantendo intensidade e frequência
      const taperIdx = weeks - w; // 0 = semana da prova
      const cutFactor = taperIdx === 0 ? 0.5 : taperIdx === 1 ? 0.65 : 0.8;
      longKm = Math.max(BASE_LONG_KM[student.goal]*0.8, buildLongKm*cutFactor);
      weeklyKm = buildWeeklyKm*cutFactor;
    } else if(isDeload){
      longKm = buildLongKm*0.75;
      weeklyKm = buildWeeklyKm*0.8;
    } else if(w>1){
      // progressão conservadora do longão: no máximo +8-10% frente à semana anterior
      // (Nielsen et al. 2024/2025: risco de lesão associado a saltos >10% numa única sessão
      // frente ao maior treino dos últimos 30 dias — não a um total semanal.)
      const growth = student.level === "iniciante" ? 1.08 : 1.12;
      buildLongKm = Math.min(TARGET_LONG_KM[student.goal], buildLongKm*growth);
      buildWeeklyKm = Math.min(weeklyCeilingKm, buildWeeklyKm*(student.level === "iniciante" ? 1.06 : 1.08));
      longKm = buildLongKm;
      weeklyKm = buildWeeklyKm;
      if(isWalkRunGoal) wrLevel++;
    }

    // O longão recebe cerca de 40-43% do volume da semana. O restante é
    // distribuído entre rodagens e sessões de qualidade, evitando rodagens
    // soltas que não conversem com a carga semanal planejada.
    if(!isWalkRunGoal){
      const longShare = phase === "especifico" || phase === "pre-competitivo" ? 0.46 : 0.42;
      const desiredLong = Math.min(TARGET_LONG_KM[student.goal], weeklyKm*longShare);
      if(!isDeload && !isTaper){
        buildLongKm = Math.min(TARGET_LONG_KM[student.goal], Math.max(buildLongKm, desiredLong));
        longKm = buildLongKm;
      }else{
        longKm = Math.min(longKm, desiredLong);
      }
      const nonEasyKm = qualitySessionKm + hillSessionKm;
      const remainingEasyKm = Math.max(2.5*easySessionCount, weeklyKm-longKm-nonEasyKm);
      easyKm = easySessionCount ? remainingEasyKm/easySessionCount : 0;
    }

    // Associa cada papel de treino (skeleton) a um dia disponível. O longão
    // sempre recebe o último dia da semana disponível (convenção usual de
    // treino de corrida — normalmente o fim de semana). Os demais papéis
    // seguem a ordem cronológica dos dias restantes. Se por algum motivo
    // faltarem dias (ex.: dados antigos salvos antes desta correção, com
    // menos dias do que a frequência), o sistema completa com qualquer dia
    // da semana ainda não usado — nunca repete um dia dentro da mesma semana.
    const dayAssignment = new Array(skeleton.length);
    const usedDays = new Set();
    const longaoIdx = skeleton.indexOf("longao");
    const longaoDay = longaoIdx > -1 ? (days.includes("Dom") ? "Dom" : days.includes("Sáb") ? "Sáb" : days[days.length-1]) : null;
    if(longaoIdx > -1){ dayAssignment[longaoIdx] = longaoDay; usedDays.add(longaoDay); }
    const otherIdxs = skeleton.map((_,i)=>i).filter(i=>i!==longaoIdx);
    const remainingDays = (longaoIdx > -1 ? days.filter(d=>d!==longaoDay) : days.slice()).filter(d=>!usedDays.has(d));
    const fallbackPool = WEEKDAY_CANON_ORDER.filter(d=>!usedDays.has(d) && !remainingDays.includes(d));
    let ptr = 0, fptr = 0;
    otherIdxs.forEach((sIdx)=>{
      let day;
      while(ptr < remainingDays.length && usedDays.has(remainingDays[ptr])) ptr++;
      if(ptr < remainingDays.length){ day = remainingDays[ptr++]; }
      else { day = fallbackPool[fptr++] || longaoDay; }
      dayAssignment[sIdx] = day;
      usedDays.add(day);
    });

    const sessions = skeleton.map((role, i)=>{
      const s = buildSession(role, w, phase, student.level, paces, Math.round(longKm*10)/10, Math.round(easyKm*10)/10, isDeload, isTaper, isWalkRunGoal, wrLevel);
      // (distância e duração de cada treino já saem corretas de buildSession,
      // calculadas a partir do que o próprio treino descreve — qualitySessionKm
      // e hillSessionKm abaixo seguem usados só para orçar o volume da semana.)
      s.day = dayAssignment[i];
      s.id = uid("ses");
      return s;
    }).sort((a,b)=> WEEKDAY_SORT_ORDER(a.day) - WEEKDAY_SORT_ORDER(b.day));

    weekList.push({
      weekNumber:w, phase, isDeload, isTaper,
      totalKm: Math.round(sessions.reduce((a,s)=>a+(s.distance||0),0)*10)/10,
      sessions
    });
  }

  return {
    id: uid("plan"), studentId: student.id, goal: student.goal, level: student.level,
    totalWeeks: weeks, taperWeeks, range, published:false, edited:false,
    generatedAt: new Date().toISOString(), weeks: weekList,
    paceBasis: paces? "Estimado a partir do resultado recente informado (fórmula de Riegel)." : "Sem resultado recente informado — prescrição por sensação de esforço (Esforço) e frequência cardíaca; recomenda-se um teste de campo (ex.: 2,4 km ou 12 min) antes de ajustar ritmos.",
  };
}

function isPublished(plan){ return !!(plan && (plan.published ?? plan.approved)); }

/* ============================ CRIAÇÃO/EDIÇÃO MANUAL DE TREINOS ============================
   Além da sugestão automática, o treinador pode montar um plano do zero e
   adicionar, duplicar, excluir, reordenar e reagendar cada treino livremente. */
const SESSION_TYPES = [
  ["leve","Rodagem leve"], ["longao","Longão"], ["intervalado","Intervalado"],
  ["tempo","Ritmo / limiar"], ["fartlek","Fartlek"], ["subida","Subidas"],
  ["regenerativo","Regenerativo"], ["caminhada_corrida","Caminhada + corrida"],
];
const SESSION_TEMPLATES = {
  leve:{name:"Rodagem leve", objective:"Manter a base aeróbica sem acumular fadiga.", warmup:"5-8 min de caminhada + trote leve.", main:"30-40 min em ritmo confortável.", cooldown:"5 min de caminhada + alongamento leve.", duration:35, distance:5, pace:"Confortável (fala frases inteiras)", hrZone:"Zona 1–2", rpe:"3–5/10", recovery:"—", notes:""},
  longao:{name:"Longão", objective:"Desenvolver resistência aeróbica e economia de corrida.", warmup:"5 min de caminhada + trote leve.", main:"Distância-alvo em ritmo confortável e constante.", cooldown:"5-10 min de caminhada + alongamento.", duration:60, distance:10, pace:"Confortável, com fala", hrZone:"Zona 2 (trechos em Zona 3 se indicado)", rpe:"4–6/10", recovery:"—", notes:"Hidrate-se antes e leve água/isotônico se ultrapassar 75-90 min."},
  intervalado:{name:"Intervalado", objective:"Desenvolver potência aeróbica e economia de corrida.", warmup:"12-15 min de trote leve + progressivos + mobilidade.", main:"6-8x400-1000m no ritmo de referência de 5 km.", cooldown:"10 min de trote leve + alongamento.", duration:50, distance:null, pace:"Forte, mas sustentável em todos os tiros", hrZone:"Zona 4", rpe:"7–8/10", recovery:"60-90s de trote leve entre os tiros", notes:"A consistência entre os tiros importa mais que o primeiro ser o mais rápido."},
  tempo:{name:"Ritmo / limiar", objective:"Melhorar a capacidade de sustentar esforço perto do limiar.", warmup:"10-12 min de trote leve.", main:"15-25 min contínuos no ritmo de limiar (ou 3x8min com 2min de trote entre).", cooldown:"8-10 min de trote leve.", duration:45, distance:null, pace:"Forte e controlado — dá para dizer poucas palavras", hrZone:"Zona 3–4", rpe:"6–7/10", recovery:"2 min de trote leve (se fracionado)", notes:""},
  fartlek:{name:"Fartlek", objective:"Variar ritmo de forma lúdica, sem estrutura rígida.", warmup:"10 min de trote leve + acelerações curtas.", main:"15-20 min alternando 1-3 min forte e 1-3 min leve, por sensação.", cooldown:"8 min de trote leve.", duration:35, distance:null, pace:"Variável, por sensação", hrZone:"Zona 2–3 (alternando)", rpe:"5–7/10", recovery:"Trote leve entre os trechos fortes", notes:""},
  subida:{name:"Treino de subidas", objective:"Ganhar força específica de corrida com baixo impacto.", warmup:"10 min de trote leve até o pé da subida.", main:"6-8x subida de 60-90m em esforço forte e controlado.", cooldown:"10 min de trote leve em terreno plano.", duration:40, distance:null, pace:"Esforço forte na subida, sem sprintar", hrZone:"Zona 3–4", rpe:"6–8/10", recovery:"Descida em trote leve entre as subidas", notes:"Passos curtos e rápidos, olhar à frente."},
  regenerativo:{name:"Treino regenerativo", objective:"Favorecer recuperação ativa sem gerar fadiga adicional.", warmup:"—", main:"20-30 min de trote bem leve ou caminhada.", cooldown:"Alongamento leve.", duration:25, distance:4, pace:"Muito confortável", hrZone:"Zona 1", rpe:"2–3/10", recovery:"—", notes:"Se possível, em terreno plano e macio."},
  caminhada_corrida:{name:"Caminhada + corrida intervalada", objective:"Construir base aeróbica com impacto controlado.", warmup:"5 min de caminhada.", main:"8x (1 min correndo leve + 2 min caminhando).", cooldown:"5 min de caminhada + alongamento leve.", duration:30, distance:null, pace:"Conversacional", hrZone:"Zona 1–2", rpe:"3–5/10", recovery:"Caminhada entre os tiros de corrida", notes:""},
};
function newSessionFromTemplate(type, day){
  const t = SESSION_TEMPLATES[type] || SESSION_TEMPLATES.leve;
  return {...t, type, day: day||"", id: uid("ses"), alternative:"Se estiver muito cansado, com pouco tempo ou dor leve: troque por 20-30 min de caminhada regenerativa ou reduza o treino pela metade."};
}
function createBlankPlan(student, totalWeeks){
  const weeks = [];
  for(let w=1; w<=totalWeeks; w++){ weeks.push({weekNumber:w, phase:"base", isDeload:false, isTaper:false, totalKm:0, sessions:[]}); }
  return {
    id: uid("plan"), studentId: student.id, goal: student.goal, level: student.level,
    totalWeeks, taperWeeks:0, range: RANGE_BY_GOAL[student.goal], published:false, edited:true,
    generatedAt: new Date().toISOString(), weeks,
    paceBasis: "Plano criado do zero pelo treinador — sem estimativa automática de ritmo.",
    manual:true,
  };
}
function recalcWeekVolume(week){ week.totalKm = Math.round(week.sessions.reduce((a,s)=>a+(s.distance||0),0)*10)/10; }

/* ============================ ALERTAS ============================ */
function computeAlerts(student, plan, logs){
  const alerts = [];
  const studentLogs = Object.values(logs).filter(l=>l.studentId===student.id).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const last5 = studentLogs.slice(-5);

  if(plan && plan.range && student.raceDate){
    const weeksAvail = Math.floor((new Date(student.raceDate)-new Date())/(1000*60*60*24*7));
    if(weeksAvail < plan.range.min){
      alerts.push({level:"bad", title:"Tempo até a prova pode ser curto", text:"Faltam cerca de "+weeksAvail+" semanas para a prova, abaixo do mínimo recomendado ("+plan.range.min+" semanas) para o objetivo escolhido. Considere um objetivo mais conservador ou ajustar a expectativa de desempenho."});
    }
  }
  const painLogs = last5.filter(l=>l.pain>=6);
  if(painLogs.length){
    alerts.push({level:"bad", title:"Dor relatada em treino recente", text:"Foi registrada dor de intensidade "+painLogs[painLogs.length-1].pain+"/10. Recomenda-se reduzir a carga e buscar avaliação de um profissional de saúde antes de continuar a progressão."});
  }
  const highRpeStreak = last5.filter(l=>l.rpe>=8).length;
  if(highRpeStreak>=3){
    alerts.push({level:"warn", title:"Sequência de esforço percebido elevado", text:"Nos últimos treinos registrados, o esforço percebido esteve consistentemente alto (Esforço ≥ 8). Considere uma sessão mais leve ou um dia extra de descanso."});
  }
  const poorSleep = last5.filter(l=>l.sleep && l.sleep<=2).length;
  if(poorSleep>=2){
    alerts.push({level:"warn", title:"Sono comprometido", text:"O aluno registrou sono ruim em treinos recentes, o que pode reduzir a recuperação. Vale revisar rotina de sono antes de aumentar a carga."});
  }
  const skipped = last5.filter(l=>l.status==="nao_realizado").length;
  if(skipped>=2){
    alerts.push({level:"warn", title:"Baixa aderência recente", text:"Dois ou mais treinos não realizados recentemente. Avalie se o volume, os dias ou o horário disponíveis ainda são realistas."});
  }
  return alerts;
}

/* ============================ ESTADO DA UI ============================ */
let UI = { view:"avaliacao" };

async function init(){
  await loadDB();
  document.body.setAttribute("data-theme", DB.config.theme || "dark");
  document.getElementById("themeBtn").textContent = DB.config.theme === "light" ? "☀" : "☾";
  document.querySelectorAll("#roleSwitch button").forEach(b=>{
    b.classList.toggle("active", b.dataset.role === (DB.config.role||"aluno"));
  });
  if(!DB.students[DB.config.activeStudentId]){
    const ids = Object.keys(DB.students);
    if(ids.length) DB.config.activeStudentId = ids[0];
  }
  render();

  document.getElementById("themeBtn").onclick = ()=>{
    DB.config.theme = DB.config.theme === "light" ? "dark" : "light";
    document.body.setAttribute("data-theme", DB.config.theme);
    document.getElementById("themeBtn").textContent = DB.config.theme === "light" ? "☀" : "☾";
    saveDB();
  };
  document.getElementById("roleSwitch").onclick = (e)=>{
    const btn = e.target.closest("button"); if(!btn) return;
    DB.config.role = btn.dataset.role;
    UI.view = btn.dataset.role === "treinador" ? "alunos" : (studentHasPlan(currentStudent()) ? "calendario" : "avaliacao");
    saveDB(); render();
  };
}

function currentStudent(){ return DB.students[DB.config.activeStudentId]; }
function planForStudent(id){ return Object.values(DB.plans).filter(p=>p.studentId===id && !p.isTemplate).at(-1) || null; }
function currentPlan(){ return planForStudent(DB.config.activeStudentId); }
function studentHasPlan(s){ return s && !!planForStudent(s.id); }

/* ============================ NAVEGAÇÃO / RENDER ============================ */
function render(){
  renderSidebar();
  renderMain();
}

function renderSidebar(){
  const role = DB.config.role || "aluno";
  const sb = document.getElementById("sidebar");
  const alunoTabs = [
    ["calendario","Meu plano"], ["ritmo","Ritmo estimado"], ["evolucao","Minha evolução"], ["base","Base científica"]
  ];
  const treinadorTabs = [
    ["alunos","Alunos"], ["plano_editar","Plano do aluno"], ["ritmo","Ritmo estimado"], ["editar_aluno","Editar aluno"], ["comparar","Comparar alunos"], ["modelos","Modelos"], ["base","Base científica"]
  ];
  const tabs = role === "treinador" ? treinadorTabs : alunoTabs;
  sb.innerHTML = tabs.map(([id,label])=>`<button data-view="${id}" class="${UI.view===id?'active':''}">${label}</button>`).join("");

  if(role === "treinador" && Object.keys(DB.students).length){
    const opts = Object.values(DB.students).map(s=>`<option value="${escapeHTML(s.id)}" ${s.id===DB.config.activeStudentId?'selected':''}>${escapeHTML(s.name)}</option>`).join("");
    sb.innerHTML += `<div class="student-pick"><label>Aluno em foco</label><select id="studentPick">${opts}</select></div>`;
  }
  sb.querySelectorAll("button[data-view]").forEach(b=>{
    b.onclick = ()=>{ UI.view = b.dataset.view; render(); };
  });
  const pick = document.getElementById("studentPick");
  if(pick) pick.onchange = (e)=>{ DB.config.activeStudentId = e.target.value; UI.week = 1; saveDB(); render(); };
}

function renderMain(){
  Object.values(CHART_INSTANCES).forEach(chart=>chart.destroy());
  CHART_INSTANCES = {};
  const main = document.getElementById("main");
  const role = DB.config.role || "aluno";
  let html = "";
  if(role === "aluno"){
    const s = currentStudent();
    if(!s || !studentHasPlan(s)){ html = viewAvaliacao(); }
    else if(UI.view === "evolucao") html = viewEvolucao(s);
    else if(UI.view === "base") html = viewBase();
    else if(UI.view === "ritmo") html = viewRitmoEstimado(s);
    else html = viewCalendarioAluno(s);
  } else {
    if(UI.view === "alunos" || !UI.view) html = viewListaAlunos();
    else if(UI.view === "plano_editar") html = viewPlanoTreinador();
    else if(UI.view === "editar_aluno") html = viewEditarAluno();
    else if(UI.view === "comparar") html = viewComparar();
    else if(UI.view === "modelos") html = viewModelos();
    else if(UI.view === "base") html = viewBase();
    else if(UI.view === "ritmo") html = viewRitmoEstimado(currentStudent());
    else if(UI.view === "novo_aluno") html = viewAvaliacao(true);
    else html = viewListaAlunos();
  }
  main.innerHTML = html;
  bindViewEvents();
}

function parseTimeStr(str){
  const text = String(str || "").trim();
  if(!/^\d+:\d{1,2}(?::\d{1,2})?$/.test(text)) return null;
  const parts = text.split(":").map(Number);
  if(parts.at(-1) >= 60 || (parts.length === 3 && parts[1] >= 60)) return null;
  const value = parts.length === 2 ? parts[0]*60+parts[1] : parts[0]*3600+parts[1]*60+parts[2];
  return value > 0 ? value : null;
}
function secToTimeStr(sec){
  if(sec == null || !Number.isFinite(sec) || sec < 0) return "";
  const total = Math.round(sec);
  return Math.floor(total/60) + ":" + String(total%60).padStart(2,"0");
}

/* ============================ VIEW: CALENDÁRIO DO ALUNO ============================ */
function viewRitmoEstimado(s){
  if(!s) return `<div class="empty">Selecione um aluno para ver o ritmo estimado.</div>`;
  const plan = planForStudent(s.id);
  const paces = estimatePaces(s.recentDistM, s.recentTimeS);
  const zones = s.age ? hrZones(s.age) : null;

  // Ordenado do mais leve ao mais forte, para leitura mais intuitiva.
  const rows = paces ? [
    ["Fácil / rodagem", paces.easy, "Confortável, dá para falar frases inteiras.", "leve"],
    ["Longão", paces.long, "Firme, ainda abaixo do limiar — sustentado por mais tempo.", "leve"],
    ["Ritmo tipo maratona", paces.marathonish, "Confortável-firme, mais lento que o limiar.", "moderado"],
    ["Tempo run", paces.tempo, "Perto do limiar, esforço sustentável por 15-25 min.", "moderado"],
    ["Ritmo de limiar", paces.threshold, "Forte e controlado, poucas palavras por vez.", "forte"],
    ["Intervalado (5 km)", paces.interval5k, "Forte, no ritmo de referência de 5 km.", "forte"],
  ] : [];

  const intensityBadge = {leve:'<span class="badge ok">leve</span>', moderado:'<span class="badge warn">moderado</span>', forte:'<span class="badge bad">forte</span>'};
  const paceCards = paces ? `
    <div class="grid grid-3">
      ${rows.map(([label,sec,desc,intensity])=>`
        <div class="card">
          <h3>${label} ${intensityBadge[intensity]||''}</h3>
          <div class="pace-tag" style="font-size:1.4em;margin:6px 0;">🏃 ${fmtPace(sec)} <small style="font-size:.55em;color:var(--text-dim);">por km</small></div>
          <p class="hint">${desc}</p>
        </div>`).join("")}
    </div>
    <div class="card" style="margin-top:16px;">
      <h3>Tempos de referência estimados</h3>
      <p class="hint" style="margin-bottom:8px;">
        Projeção via fórmula de Riegel (1977), a partir do resultado recente informado. É uma
        estimativa, revisável a qualquer momento pelo treinador — não uma promessa de desempenho.
      </p>
      <div class="grid grid-3">
        <div><span class="lbl">5 km previsto</span><br>${secToTimeStr(paces.predicted5k)}</div>
        <div><span class="lbl">10 km previsto</span><br>${secToTimeStr(paces.predicted10k)}</div>
        <div><span class="lbl">Ritmo de limiar</span><br>${fmtPace(paces.threshold)}</div>
      </div>
    </div>
  ` : `
    <div class="empty">
      Nenhum resultado recente foi informado para este aluno, então o sistema não estima ritmos —
      a prescrição segue por sensação de esforço e frequência cardíaca.<br><br>
      Sugestão: registre um teste de campo (ex.: 2,4 km ou 12 minutos em esforço forte e sustentável)
      na edição do aluno para liberar as estimativas de ritmo aqui.
    </div>
  `;

  const hrCards = zones ? `
    <div class="card" style="margin-top:16px;">
      <h3>Zonas de frequência cardíaca estimadas</h3>
      <p class="hint" style="margin-bottom:8px;">FC máxima estimada (Tanaka et al.): ~${zones.hrmax} bpm.</p>
      <div class="grid grid-3">
        <div><span class="lbl">Zona 1 (recuperação)</span><br>${zones.z1[0]}–${zones.z1[1]} bpm</div>
        <div><span class="lbl">Zona 2 (base)</span><br>${zones.z2[0]}–${zones.z2[1]} bpm</div>
        <div><span class="lbl">Zona 3 (moderado)</span><br>${zones.z3[0]}–${zones.z3[1]} bpm</div>
        <div><span class="lbl">Zona 4 (limiar)</span><br>${zones.z4[0]}–${zones.z4[1]} bpm</div>
        <div><span class="lbl">Zona 5 (máximo)</span><br>${zones.z5[0]}–${zones.z5[1]} bpm</div>
      </div>
    </div>
  ` : "";

  const weekSnapshot = (plan && isPublished(plan) && plan.weeks && plan.weeks.length) ? (()=>{
    const wk = plan.weeks.find(w=>w.weekNumber===(UI.week||1)) || plan.weeks[0];
    const items = wk.sessions.map(ses=>`
      <div class="ref-item">
        <div class="src">${escapeHTML(ses.day || "—")}</div>
        <h4>${escapeHTML(ses.name)}</h4>
        <p>🏃 ${escapeHTML(ses.pace || "—")} ${ses.hrZone? " · ❤ "+escapeHTML(ses.hrZone) : ""} ${ses.rpe? " · Esforço "+escapeHTML(ses.rpe) : ""}</p>
      </div>`).join("");
    return `
    <div class="card" style="margin-top:16px;">
      <h3>Ritmo previsto nesta semana (Semana ${wk.weekNumber})</h3>
      <p class="hint" style="margin-bottom:8px;">Ritmo de referência de cada treino já agendado no plano atual, na ordem dos dias da semana.</p>
      ${items}
    </div>`;
  })() : "";

  return `
  <div class="section-title"><h2>Ritmo estimado${s.name? " — "+escapeHTML(s.name) : ""}</h2></div>
  <p class="hint" style="max-width:680px;margin-bottom:16px;">
    Ritmos de referência calculados a partir dos dados do aluno, para consulta rápida antes ou
    durante o treino. ${escapeHTML(plan?.paceBasis)}
  </p>
  ${paceCards}
  ${hrCards}
  ${weekSnapshot}
  `;
}

          <div class="field full"><button class="btn secondary" data-save="${escapeHTML(ses.id)}">Salvar registro</button></div>
        </div>
      </div>
    </div>`;
  }).join("");

  return `
  <div class="section-title"><h2>Plano de ${escapeHTML(s.name)}</h2><span class="count">${plan.range.label} · ${plan.totalWeeks} semanas · publicado pelo treinador</span></div>
  ${alerts.map(a=>`<div class="alert ${a.level==='warn'?'warn':''}"><div class="t">${a.title}</div>${a.text}</div>`).join("")}
  <div class="btn-row no-print" style="margin-bottom:14px;">
    <button class="btn secondary" id="btnExportCsv">Exportar planilha (CSV)</button>
    <button class="btn secondary" id="btnImprimir">Imprimir / salvar em PDF</button>
  </div>
  <div class="week-strip">${strip}</div>
  <div class="card"><h3>Semana ${week.weekNumber} — ${labelFase(week)}</h3>
    <p class="hint">Volume planejado da semana: ${fmtKm(week.totalKm)}</p>
    ${sessionsHtml}
  </div>`;
}

function labelFase(w){
  if(w.isTaper) return "polimento pré-prova";
  if(w.isDeload) return "semana regenerativa";
  return {base:"base aeróbica", especifico:"específica", "pre-competitivo":"pré-competitiva"}[w.phase] || w.phase;
}
function statusBadge(status){
  const map = {concluido:["ok","Concluído"], parcial:["warn","Parcial"], nao_realizado:["bad","Não realizado"]};
  const [cls,label] = map[status] || ["muted","Pendente"];
  return `<span class="badge ${cls}">${label}</span>`;
}
function statusLabel(status){
  const map = {concluido:"Concluído", parcial:"Parcial", nao_realizado:"Não realizado"};
  return map[status] || "Pendente";
}

const SESSION_TAG_LABEL = {

function buildPrintHTML(s, plan){
  const generatedAt = new Date().toLocaleDateString("pt-BR");
  const allLogs = Object.values(DB.logs).filter(l=>l.studentId===s.id);
  let totalPlannedKm = 0, totalRealKm = 0, totalSessions = 0, totalDone = 0;

  // -------- Visão geral (uma linha por semana, antes do detalhamento) --------
  const overviewRows = plan.weeks.map(w=>{
    const ids = new Set(w.sessions.map(x=>x.id));
    const weekLogs = allLogs.filter(l=>ids.has(l.sessionId));
    const done = weekLogs.filter(l=>l.status==='concluido'||l.status==='parcial').length;
    const rowClass = w.isTaper? "taper-row" : w.isDeload? "deload-row" : "";
    const dotColor = w.isTaper? "#8b1c0c" : w.isDeload? "#c99a3a" : "#3fa796";
    return `<tr class="${rowClass}">
      <td><span class="print-phase-dot" style="background:${dotColor};"></span>Semana ${w.weekNumber}</td>
      <td>${labelFase(w)}</td>
      <td>${w.sessions.map(x=>escapeHTML(x.day||'—')).join(", ")}</td>
      <td>${fmtKm(w.totalKm)}</td>
      <td>${done}/${w.sessions.length}</td>
    </tr>`;
  }).join("");

  const overviewHtml = `
  <div class="print-overview">
    <h2>Visão geral do plano</h2>
    <table class="print-overview-table">
      <tr><th>Semana</th><th>Fase</th><th>Dias</th><th>Km planejado</th><th>Concluídos</th></tr>
      ${overviewRows}
    </table>
  </div>`;

  // -------- Detalhamento semana a semana --------
  const weeksHtml = plan.weeks.map(w=>{
    let weekRealKm = 0, weekDone = 0;
    const sessionsHtml = w.sessions.map(ses=>{
      const log = allLogs.find(l=>l.sessionId===ses.id);
      const isDone = log && (log.status==='concluido' || log.status==='parcial');
      if(isDone){ weekRealKm += (log.distanceReal||0); weekDone++; }

      const tagColor = SESSION_TAG_COLOR[ses.type] || "#777";
      const tagLabel = SESSION_TAG_LABEL[ses.type] || ses.name;

      const stats = [
        ses.distance!=null? `<div class="print-stat">📏 <b>${fmtKm(ses.distance)}</b></div>` : "",
        ses.duration!=null? `<div class="print-stat">⏱ <b>${escapeHTML(ses.duration)} min</b></div>` : "",
        ses.pace? `<div class="print-stat">🎯 <b>${escapeHTML(ses.pace)}</b></div>` : "",
        ses.hrZone? `<div class="print-stat">❤ ${escapeHTML(ses.hrZone)}</div>` : "",
        ses.rpe? `<div class="print-stat">🔋 Esforço ${escapeHTML(ses.rpe)}</div>` : "",
      ].join("");

      const steps = [
        ses.warmup? `<li><b>Aquecimento</b>${escapeHTML(ses.warmup)}</li>` : "",
        ses.main? `<li><b>Parte principal</b>${escapeHTML(ses.main)}</li>` : "",
        ses.cooldown? `<li><b>Desaquecimento</b>${escapeHTML(ses.cooldown)}</li>` : "",
      ].join("");

      const extraLines = [
        ses.recovery && ses.recovery !== "—" ? `<div><b>Recuperação:</b> ${escapeHTML(ses.recovery)}</div>` : "",
        ses.notes? `<div><b>Observações do treinador:</b> ${escapeHTML(ses.notes)}</div>` : "",
        ses.alternative? `<div><b>Alternativa mais leve:</b> ${escapeHTML(ses.alternative)}</div>` : "",
      ].join("");

      const logHtml = log ? `
        <div class="print-log">
          <span class="print-log-title">Realizado — ${statusLabel(log.status)}</span>
          <div class="print-log-grid">
            <span>Distância <b>${log.distanceReal!=null? fmtKm(log.distanceReal):'—'}</b></span>
            <span>Duração <b>${log.durationReal!=null? log.durationReal+' min':'—'}</b></span>
            <span>Ritmo <b>${escapeHTML(log.paceReal||'—')}</b></span>
            <span>FC <b>${log.hr!=null? log.hr+' bpm':'—'}</b></span>
            <span>Esforço <b>${log.rpe!=null? log.rpe:'—'}</b></span>
            <span>Dor <b>${log.pain!=null? log.pain:'—'}</b></span>
            <span>Fadiga <b>${log.fatigue!=null? log.fatigue:'—'}</b></span>
            <span>Sono <b>${log.sleep!=null? log.sleep:'—'}</b></span>
            <span>Satisfação <b>${log.satisfaction!=null? log.satisfaction:'—'}</b></span>
          </div>
          ${log.notes? `<div class="print-log-note">Obs. do aluno: ${escapeHTML(log.notes)}</div>` : ''}
        </div>` : `<div class="print-log print-log-pending">Ainda não registrado pelo aluno.</div>`;

      return `
      <div class="print-session" style="border-left-color:${tagColor};">
        <div class="print-session-head">
          <h3>${escapeHTML(ses.day || '—')} — ${escapeHTML(ses.name)}</h3>
          <span class="print-session-tag" style="background:${tagColor};">${tagLabel}</span>
        </div>
        <div class="print-stats-row">${stats}</div>
        <ol class="print-steps">${steps}</ol>
        ${extraLines? `<div class="print-extra">${extraLines}</div>` : ""}
        ${ses.objective? `<div class="print-extra" style="margin-top:6px;"><div><b>Objetivo:</b> ${escapeHTML(ses.objective)}</div></div>` : ""}
        ${logHtml}
      </div>`;
    }).join("");

    totalPlannedKm += w.totalKm;
    totalRealKm += weekRealKm;
    totalSessions += w.sessions.length;
    totalDone += weekDone;

    return `
    <div class="print-week">
      <h2>Semana ${w.weekNumber}</h2>
      <p class="print-week-sub">${labelFase(w)}</p>
      <div class="print-week-summary">
        <div class="chip">Planejado<strong>${fmtKm(w.totalKm)}</strong></div>
        <div class="chip">Realizado<strong>${fmtKm(weekRealKm)}</strong></div>
        <div class="chip">Concluídos<strong>${weekDone}/${w.sessions.length}</strong></div>
      </div>
      ${sessionsHtml || '<p class="hint">Nenhum treino cadastrado nesta semana.</p>'}
    </div>`;
  }).join("");

  const adherenceTotal = totalSessions? Math.round(totalDone/totalSessions*100) : 0;
  const totalsHtml = `
  <div class="print-week print-total">
    <h2>Total geral do plano</h2>
    <div class="print-week-summary">
      <div class="chip">Duração do plano<strong>${plan.totalWeeks} semanas</strong></div>
      <div class="chip">Volume total planejado<strong>${fmtKm(totalPlannedKm)}</strong></div>
      <div class="chip">Volume total realizado<strong>${fmtKm(totalRealKm)}</strong></div>
      <div class="chip">Treinos concluídos<strong>${totalDone} de ${totalSessions}</strong></div>
      <div class="chip">Aderência<strong>${adherenceTotal}%</strong></div>
    </div>
  </div>`;

  return `
  <div class="print-header">
    <img class="print-logo" src="data:image/png;base64,${LOGO_PRINT_B64}" alt="TAO Performance">
    <h1>Planilha de treino de corrida</h1>
    <div class="print-meta">
      <div><strong>Aluno:</strong> ${escapeHTML(s.name)}</div>
      <div><strong>Objetivo:</strong> ${RANGE_BY_GOAL[s.goal]?.label || s.goal}</div>
      <div><strong>Nível:</strong> ${escapeHTML(s.level)}</div>
      <div><strong>Data da prova:</strong> ${escapeHTML(s.raceDate || '—')}</div>
      <div><strong>Duração do plano:</strong> ${plan.totalWeeks} semanas</div>
      <div><strong>Gerado em:</strong> ${generatedAt}</div>
    </div>
  </div>
  ${overviewHtml}
  ${weeksHtml}
  ${totalsHtml}`;
}


/* ============================ VIEW: EVOLUÇÃO / ESTATÍSTICAS ============================ */
function viewEvolucao(s){
  const plan = currentPlan();
  const logs = Object.values(DB.logs).filter(l=>l.studentId===s.id);
  const done = logs.filter(l=>l.status==="concluido" || l.status==="parcial");
  const totalKmReal = done.reduce((a,l)=>a+(l.distanceReal||0),0);
  const totalPlanned = plan? plan.weeks.reduce((a,w)=>a+w.totalKm,0) : 0;
  // Aderência = % de treinos JÁ REGISTRADOS (concluído/parcial/não realizado) que foram
  // concluídos ou parciais. Usar o total de treinos do plano inteiro no denominador
  // distorceria o número no início do plano (a maioria dos treinos ainda nem aconteceu).
  const adherence = logs.length ? Math.round(done.length / logs.length * 100) : 0;
  const paces = plan? estimatePaces(s.recentDistM, s.recentTimeS) : null;

  return `
  <div class="section-title"><h2>Evolução de ${escapeHTML(s.name)}</h2></div>
  <div class="grid grid-4" style="margin-bottom:18px;">
    <div class="tile"><div class="label">Volume total realizado</div><div class="value">${Math.round(totalKmReal)}<small> km</small></div></div>
    <div class="tile"><div class="label">Volume total planejado</div><div class="value">${Math.round(totalPlanned)}<small> km</small></div></div>
    <div class="tile"><div class="label">Aderência ao plano</div><div class="value">${adherence}<small>%</small></div></div>
    <div class="tile"><div class="label">Treinos registrados</div><div class="value">${logs.length}</div></div>
  </div>
  <div class="grid grid-2">
    <div class="card"><h3>Volume semanal — planejado vs. realizado</h3><div class="chart-wrap"><canvas id="chartVolume"></canvas></div></div>
    <div class="card"><h3>Carga interna (duração × Esforço)</h3><div class="chart-wrap"><canvas id="chartCarga"></canvas></div>
      <p class="hint">Indicador auxiliar de carga de treino (duração em minutos × esforço percebido). Não é uma medida validada de risco de lesão — use como um sinal a mais, junto com dor, sono e sensação geral.</p>
    </div>
  </div>
  <div class="grid grid-2">
    <div class="card"><h3>Ritmo médio ao longo do tempo</h3><div class="chart-wrap"><canvas id="chartPace"></canvas></div></div>
    <div class="card"><h3>Distribuição de esforço percebido</h3><div class="chart-wrap"><canvas id="chartRpe"></canvas></div></div>
  </div>
  <div class="card">
    <h3>Previsão cautelosa de desempenho</h3>
    ${paces ? `
      <p>Com base no resultado recente informado, e apenas como estimativa estatística (fórmula de Riegel):</p>
      <table><tr><th>Distância</th><th>Tempo estimado</th><th>Ritmo estimado</th></tr>
      <tr><td>5 km</td><td>${fmtTime(paces.predicted5k)}</td><td class="pace-tag">${fmtPace(paces.predicted5k/5)}</td></tr>
      <tr><td>10 km</td><td>${fmtTime(paces.predicted10k)}</td><td class="pace-tag">${fmtPace(paces.predicted10k/10)}</td></tr>
      </table>
      <p class="hint">Margem de incerteza: estimativas do tipo Riegel costumam variar ±3 a 5% frente ao desempenho real, e pioram quanto mais distante a distância-alvo estiver do resultado usado como base. Dados usados: ${escapeHTML(s.recentDistM)} m em ${s.recentTimeS? fmtTime(s.recentTimeS): '—'}.</p>
    ` : `<p class="hint">Nenhum resultado recente foi informado, então nenhuma previsão numérica é apresentada aqui — o que evita inventar uma meta sem base. Um teste de campo (ex.: 2,4 km ou 12 minutos em esforço forte) permitiria estimativas futuras.</p>`}
  </div>`;
}
function fmtTime(sec){
  sec = Math.round(sec);
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return (h? h+":" : "") + String(m).padStart(h?2:1,"0")+":"+String(s).padStart(2,"0");
}

function drawCharts(s){
  const plan = currentPlan(); if(!plan) return;
  const logs = Object.values(DB.logs).filter(l=>l.studentId===s.id);
  const weekLabels = plan.weeks.map(w=>"S"+w.weekNumber);
  const plannedVol = plan.weeks.map(w=>w.totalKm);
  const realVol = plan.weeks.map(w=>{
    const ids = new Set(w.sessions.map(ss=>ss.id));
    return logs.filter(l=>ids.has(l.sessionId) && (l.status==='concluido'||l.status==='parcial')).reduce((a,l)=>a+(l.distanceReal||0),0);
  });
  chartOrNone("chartVolume","bar",{labels:weekLabels,datasets:[
    {label:"Planejado (km)",data:plannedVol,backgroundColor:"#4a4a50"},
    {label:"Realizado (km)",data:realVol,backgroundColor:"#c1341b"}]});

  const cargaLabels = logs.map((l,i)=>"T"+(i+1));
  const carga = logs.map(l=> (l.durationReal||0) * (l.rpe||0));
  chartOrNone("chartCarga","line",{labels:cargaLabels,datasets:[{label:"Carga (min×Esforço)",data:carga,borderColor:"#3fa796",backgroundColor:"rgba(63,167,150,.15)",fill:true,tension:.3}]});

  const paceLabels = logs.filter(l=>parsePaceToSec(l.paceReal) != null).map((l,i)=>"T"+(i+1));
  const paceVals = logs.filter(l=>parsePaceToSec(l.paceReal) != null).map(l=>parsePaceToSec(l.paceReal)/60);
  chartOrNone("chartPace","line",{labels:paceLabels,datasets:[{label:"Ritmo (min/km)",data:paceVals,borderColor:"#c1341b",backgroundColor:"rgba(193,52,27,.12)",fill:true,tension:.3}]}, {reverse:true});

  const rpeBuckets = Array(11).fill(0);
  logs.forEach(l=>{ if(l.rpe!=null) rpeBuckets[Math.max(0, Math.min(10, Math.round(l.rpe)))]++; });
  chartOrNone("chartRpe","bar",{labels:rpeBuckets.map((_,i)=>i), datasets:[{label:"Nº de treinos",data:rpeBuckets,backgroundColor:"#d97a2b"}]});
}
let CHART_INSTANCES = {};
function chartOrNone(id, type, data, yOpts){
  const el = document.getElementById(id); if(!el) return;
  if(typeof Chart !== "function"){
    const hint = document.createElement("p"); hint.className = "hint"; hint.textContent = "Gráfico indisponível. Confira a conexão e recarregue a página.";
    el.replaceWith(hint); return;
  }
  if(CHART_INSTANCES[id]) CHART_INSTANCES[id].destroy();
  CHART_INSTANCES[id] = new Chart(el, {
    type, data,
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{labels:{color:"#9b9a9c"}}},
      scales:{
        x:{ticks:{color:"#9b9a9c"},grid:{color:"#2d2d31"}},
        y:{ticks:{color:"#9b9a9c"},grid:{color:"#2d2d31"}, ...(yOpts||{})}
      }
    }
  });
}

          <button class="btn secondary" data-move-ses="${escapeHTML(ses.id)}" data-dir="1" ${idx===week.sessions.length-1?'disabled':''}>▼ Mover</button>
          <select data-goto-week="${escapeHTML(ses.id)}" style="width:auto;">
            <option value="">Reagendar p/ semana…</option>${weekOptions}
          </select>
        </div>
      </div>
    </div>`).join("");

  return `
  <div class="section-title"><h2>Plano de ${escapeHTML(s.name)}</h2>
    <span class="count">${isPublished(plan)? '<span class="badge ok">Publicado para o aluno</span>' : '<span class="badge warn">Rascunho — aluno ainda não vê este plano</span>'}</span>
  </div>
  ${alerts.map(a=>`<div class="alert ${a.level==='warn'?'warn':''}"><div class="t">${a.title}</div>${a.text}</div>`).join("")}
  ${alerts.length? `<p class="hint" style="margin:-6px 0 14px;">Alertas são apenas apoio à decisão — a palavra final sobre o treino é sempre do treinador.</p>`:''}
  <div class="btn-row no-print" style="margin-bottom:14px;">
    ${!isPublished(plan)? `<button class="btn" id="btnPublicar" title="O aluno só vê o plano depois de publicado">Publicar para o aluno</button>` : `<button class="btn secondary" id="btnDespublicar">Voltar para rascunho</button>`}
    <button class="btn secondary" id="btnRegerar">Gerar nova sugestão</button>
    <button class="btn secondary" id="btnDuplicar">Salvar como modelo</button>
    <button class="btn secondary" id="btnExportCsv">Exportar CSV (Excel)</button>
    <button class="btn secondary" id="btnImprimir">Imprimir / exportar PDF</button>
  </div>
  <div class="week-strip">${strip}</div>
  <div class="card">
    <h3>Semana ${week.weekNumber} — ${labelFase(week)}</h3>
    <p class="hint">Volume planejado: ${fmtKm(week.totalKm)}. Toque em um treino para editar.</p>
    ${sessionsHtml || '<p class="hint">Nenhum treino nesta semana ainda.</p>'}
    <div class="btn-row no-print" style="margin-top:10px;border-top:1px solid var(--line);padding-top:14px;">
      <select id="newSesType" style="width:auto;">${typeOptions}</select>
      <input id="newSesDay" placeholder="Dia (ex.: Ter)" style="width:120px;">
      <button class="btn" id="btnAddSes">+ Adicionar treino</button>
    </div>
  </div>`;
}

/* ============================ VIEW: COMPARAR ALUNOS ============================ */
function viewComparar(){
  const list = Object.values(DB.students);
  if(list.length < 1) return `<div class="empty">Cadastre ao menos um aluno para comparar.</div>`;
  const rows = list.map(s=>{
    const plan = planForStudent(s.id);
    const logs = Object.values(DB.logs).filter(l=>l.studentId===s.id);
    const done = logs.filter(l=>l.status==='concluido' || l.status==='parcial');
    const kmReal = done.reduce((a,l)=>a+(l.distanceReal||0),0);
    const adherence = logs.length? Math.round(done.length / logs.length * 100) : 0;
    return `<tr><td>${escapeHTML(s.name)}</td><td>${RANGE_BY_GOAL[s.goal]?.label||s.goal}</td><td>${plan?plan.totalWeeks+' sem.':'—'}</td><td>${Math.round(kmReal)} km</td><td>${adherence}%</td></tr>`;
  }).join("");
  return `<div class="section-title"><h2>Comparar alunos</h2></div>
  <table><tr><th>Aluno</th><th>Objetivo</th><th>Duração do plano</th><th>Volume realizado</th><th>Aderência</th></tr>${rows}</table>`;
}

/* ============================ VIEW: MODELOS ============================ */
function viewModelos(){
  const templates = Object.values(DB.plans).filter(p=>p.isTemplate);
  return `<div class="section-title"><h2>Modelos de planilha</h2></div>
  <p class="hint" style="margin-bottom:14px;">Planos marcados como modelo por "Duplicar como modelo" na tela de um aluno. Use-os como ponto de partida para novos alunos com objetivo semelhante.</p>
  ${templates.length===0? `<div class="empty">Nenhum modelo salvo ainda. Gere um plano para um aluno e use "Duplicar como modelo".</div>` :
  `<table><tr><th>Nome do modelo</th><th>Objetivo</th><th>Duração</th></tr>
  ${templates.map(t=>`<tr><td>${escapeHTML(t.templateName)}</td><td>${RANGE_BY_GOAL[t.goal]?.label}</td><td>${escapeHTML(t.totalWeeks)} semanas</td></tr>`).join("")}</table>`}`;
}
